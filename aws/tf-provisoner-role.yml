AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Generation of policies and entities that will be used to provision the resources for the leonomano-do-k8s-cluster project.

Parameters:
  Env:
    Type: String
    Description: Project Environment
    Default: dev
  ProjectName:
    Type: String
    Description: Project Name
    Default: leonomano-do-k8s-cluster
  AppName:
    Type: String
    Description: Application Name
    Default: tf-service-role
  UserName:
    Type: String
    Description: Name of provisioner user
    Default: provisioner
  GithubOrg:
    Type: String
    Description: GitHub organization/user that owns the CI/CD repository
    Default: leosykes117
  GithubRepo:
    Type: String
    Description: GitHub repository allowed to assume the GitHub Actions OIDC role
    Default: leonomano-doks-tg-infra

Transform: AWS::LanguageExtensions

Resources:
  AssumeRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Policy for assuming provisioner role"
      ManagedPolicyName: !Join
        - "-"
        - - !Ref ProjectName
          - !Ref AppName
          - assume-role-service
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAssumeRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt ProvisionerRole.Arn
      Groups:
        - !Ref ProvisioningGroup

  ProvisioningGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
          - archicture-provisioning

  S3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Politica para escritura y lectura del servicio de S3"
      ManagedPolicyName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
          - "s3-management"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3Actions
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteObject*
              - s3:GetAccelerateConfiguration
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetMetricsConfiguration
              - s3:GetObject*
              - s3:GetReplicationConfiguration
              - s3:ListBucket*
              - s3:PutBucketAcl
              - s3:PutBucketLogging
              - s3:PutBucketNotification
              - s3:PutBucketOwnershipControls
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutObject*
              - s3:*BucketWebsite
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${Env}-${ProjectName}*

          - Sid: AllowNoResource
            Effect: Allow
            Action: s3:ListAllMyBuckets
            Resource: "*"

  DynamoPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Politica que contiene los permisos de S3 y Dynamo para alojar y bloquear el estado del proyecto de terraform"
      ManagedPolicyName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
          - "dynamo-management"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDynamoDBTableActions
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/${Env}-${ProjectName}*

  SSMManagerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: This policy grants read and write permissions for System Manager parameters.
      ManagedPolicyName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
          - ssm-parameters-rw
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowWithResource
            Effect: Allow
            Action:
              # [DeleteParameter, DeleteParameters
              - ssm:DeleteParameter*
              - ssm:GetParameter*
              - ssm:PutParameter
              # [LabelParameterVersion, UnlabelParameterVersion]
              - ssm:*ParameterVersion
              # [AddTagsToResource, ListTagsForResource, RemoveTagsFromResource]
              - ssm:*Tags*
              # [DeleteResourcePolicy, GetResourcePolicies, PutResourcePolicy]
              - ssm:*ResourcePolic*
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/account-configuration*/${Env}/*
          - Sid: AllowWithoutResource
            Effect: Allow
            Action:
              - ssm:DescribeParameters
            Resource: "*"

  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: This policy grants permissions to manage IAM identity resources and policies.
      ManagedPolicyName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
          - "iam-management"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowScopedUserAndAccessKeyManagement
            Effect: Allow
            Action:
              - iam:CreateAccessKey
              - iam:CreateUser
              - iam:DeleteAccessKey
              - iam:DeleteUser
              - iam:DeleteUserPolicy
              - iam:GetUser
              - iam:GetUserPolicy
              - iam:GetAccessKeyLastUsed
              - iam:ListAccessKeys
              - iam:ListUserTags
              - iam:ListGroupsForUser
              - iam:ListUsers
              - iam:PutUserPolicy
              - iam:TagUser
              - iam:UpdateUser
              - iam:UntagUser
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${Env}/${ProjectName}*
          - Sid: AllowListAccessKeysWithWildcard
            Effect: Allow
            Action:
              - iam:ListAccessKeys
            Resource: "*"

  ProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - !Ref AppName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "${AWS::AccountId}"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref S3Policy
        - !Ref DynamoPolicy
        - !Ref SSMManagerPolicy
        - !Ref IAMPolicy

  MinikubeArgoProvisionerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - "minikube-argo-workflows"
      Path: !Sub /${Env}/${ProjectName}/${AppName}/users/

  MinikubeArgoProvisionerUserAccessKeys:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref MinikubeArgoProvisionerUser

  MiniKubeArgoProvisionerUserKeysParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-configuration/${Env}/minikube_argo_provisioner_access_keys
      Type: String
      Value:
        Fn::ToJsonString:
          access-key: !Ref MinikubeArgoProvisionerUserAccessKeys
          secret-access-key: !GetAtt MinikubeArgoProvisionerUserAccessKeys.SecretAccessKey
      Description: SSM Parameter with the Acess Keys to use in Minikube Argo Workflows
      Tags:
        Environment: !Sub ${Env}

  AdditionToProvisioningGroup:
    Type: AWS::IAM::UserToGroupAddition
    Properties:
      GroupName: !Ref ProvisioningGroup
      Users:
        - leo_dev
        - !Ref MinikubeArgoProvisionerUser

  #### GitHub Actions OIDC Role and Policy for provisioning via GitHub Actions workflows (per environment) ####
  GithubActionsCIReadSSMParamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only SSM access for GitHub Actions workflows
      ManagedPolicyName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - "github-actions-ci-ssm-params-read"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowReadSecretsParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/account-configuration/${Env}/digital_ocean_token
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/account-configuration/${Env}/external-secrets-operator/secret-store-access-credentials

  GithubActionsProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - "-"
        - - !Ref Env
          - !Ref ProjectName
          - "github-actions-oidc-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubOrg}/${GithubRepo}:*"
      ManagedPolicyArns:
        - !Ref AssumeRolePolicy
        - !Ref GithubActionsCIReadSSMParamPolicy

Outputs:
  ProvisionerRoleARN:
    Description: Terraform Role Service ARN
    Value: !GetAtt ProvisionerRole.Arn
  GithubActionsProvisionerRoleARN:
    Description: >
      Role ARN for GitHub Actions to assume via OIDC (aws-actions/configure-aws-credentials).
      Set this as the AWS_ROLE_TO_ASSUME secret/variable for this environment in the
      leonomano-doks-tg-infra repo (repo or GitHub Environment scoped secret).
    Value: !GetAtt GithubActionsProvisionerRole.Arn
  MinikubeArgoProvisionerARN:
    Description: AWS User ARN to use in Minikube Argo Workflow
    Value: !GetAtt MinikubeArgoProvisionerUser.Arn
  MiniKubeArgoProvisionerUserKeysParam:
    Description: Contains the AWS SSM Param Name with the access keys for Minikube Argo Workflow Provisioner User
    Value: !Ref MiniKubeArgoProvisionerUserKeysParam
